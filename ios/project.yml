# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). The checked-in WatchCompare.xcodeproj is
# the source of truth; this file lets you regenerate it (`xcodegen generate`) if it ever drifts.
name: WatchCompare
options:
  bundleIdPrefix: com.hsuanlee
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  WatchCompareKit:
    path: WatchCompareKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Production API for every configuration; override at runtime with -WC_API_BASE_URL.
    API_BASE_URL: https://watch-compare-api-m7slk5b25q-de.a.run.app
    # OneSignal app id for push alerts (public, not a secret). Empty builds the app without push.
    ONESIGNAL_APP_ID: 6e12337f-212f-4ec3-9c38-01e83635d2fe
targets:
  WatchCompare:
    type: application
    platform: iOS
    sources:
      - path: WatchCompare
        excludes: ["Info.plist", "WatchCompare.entitlements"]
    dependencies:
      - package: WatchCompareKit
    info:
      path: WatchCompare/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        CFBundleDisplayName: WatchCompare
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hant, zh-Hans, ja, de]
        OneSignalAppID: $(ONESIGNAL_APP_ID)
        UIBackgroundModes: [remote-notification]
        NSUserTrackingUsageDescription: This lets WatchCompare measure which searches and marketplaces lead to purchases, so we can improve results and show you relevant offers.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsuanlee.watchcompare
        CODE_SIGN_ENTITLEMENTS: WatchCompare/WatchCompare.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
