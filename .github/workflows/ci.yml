name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS runners bill at 10x Linux minutes, so the iOS job only runs when ios/ (or this file) changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'ios/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: integration test (embedded PostgreSQL)
        run: TEST_EMBEDDED_PG=1 go test -count=1 -run TestRepositoryEndToEnd ./internal/repository/

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      API_URL: http://127.0.0.1:9 # unreachable on purpose; pages must degrade gracefully
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  ios:
    name: iOS (Swift)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: package build + unit tests (macOS host, no simulator needed)
        run: swift test --package-path WatchCompareKit
      - name: app build for iOS Simulator (unsigned)
        run: >
          xcodebuild -project WatchCompare.xcodeproj -scheme WatchCompare
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGNING_ALLOWED=NO build
